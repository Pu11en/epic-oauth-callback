<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-XrREoahmr5QErZXo4Y/LUtWd0n0OMK+gx7/r7JMUqbs='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Return to GOMER</title>
  <style>body{font:16px system-ui;max-width:38rem;margin:10vh auto;padding:1.5rem;color:#17202a}p{line-height:1.5}a{display:inline-block;padding:.75rem 1rem;border-radius:.5rem;background:#17202a;color:white;text-decoration:none;font-weight:600}a[hidden]{display:none}</style>
</head>
<body>
  <h1>Returning to GOMER…</h1>
  <p id="status">Keep GOMER open. This tab will connect back to the GOMER plugin on this computer.</p>
  <p><a id="return" hidden>Return to GOMER</a></p>
  <script>
(()=>{const q=new URLSearchParams(location.search),one=k=>q.getAll(k).length===1?q.get(k):null,s=one("state")||"",m=/^g1\.(\d{4,5})\.[A-Za-z0-9_-]{32,}$/.exec(s),p=m?Number(m[1]):0,o=new URLSearchParams(),a=document.querySelector("#return"),t=document.querySelector("#status");for(const k of["state","code","error"]){const v=one(k);if(v!==null)o.set(k,v)}if(!m||p<1024||p>65535||!o.get("state")||(!o.get("code")===!o.get("error"))){t.textContent="This authorization cannot be returned safely. Close this tab and start again in GOMER.";return}const u=`http://127.0.0.1:${p}/callback?${o}`;a.href=u;a.hidden=false;t.textContent="If GOMER does not open automatically, click Return to GOMER.";setTimeout(()=>location.replace(u),150)})();
  </script>
</body>
</html>
